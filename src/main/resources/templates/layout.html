<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Grocery Admin Panel</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom styles -->
    <link th:href="@{/style.css}" rel="stylesheet">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            🛒 Grocery Admin Panel
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Logged in: admin menu -->
            <th:block th:if="${session.loggedInUser != null}">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/list}">Manage Admins</a>
                    </li>
                    <li class="nav-item" th:if="${session.loggedInUser.adminLevel == 'SUPER'}">
                        <a class="nav-link" th:href="@{/admin/register}">Register Admin</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <span th:text="${session.loggedInUser.username}"></span>
                            <span class="badge bg-warning text-dark ms-1"
                                  th:text="${session.loggedInUser.adminLevel}"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/admin/edit(id=${session.loggedInUser.id})}">My Profile</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item text-danger" th:href="@{/admin/logout}">Logout</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </th:block>

            <!-- Not logged in -->
            <ul class="navbar-nav ms-auto" th:if="${session.loggedInUser == null}">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/login}">Admin Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ── Page content ─────────────────────────────────────────────────── -->
<main th:replace="${content}"></main>

<!-- ── Footer ───────────────────────────────────────────────────────── -->
<footer class="bg-light border-top mt-5 py-3">
    <div class="container text-center text-muted small">
        Grocery Order Management System &mdash; Admin Management Module &mdash; SE1020 OOP Project
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
