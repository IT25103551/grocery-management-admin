<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Admin Dashboard</title>
<main>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2>Admin Dashboard</h2>
            <span class="text-muted small">
                Logged in as <strong th:text="${session.loggedInUser.username}"></strong>
                (<span th:text="${session.loggedInUser.adminLevel}"></span>)
            </span>
        </div>
        <p class="text-muted small mb-4"
           th:text="'Your permissions: ' + ${session.loggedInUser.permissionsSummary}"></p>

        <!-- Totals -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card text-center border-0 bg-light">
                    <div class="card-body">
                        <p class="text-muted mb-1 small">Total Admins</p>
                        <h3 class="fw-bold" th:text="${totalAdmins}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center border-0 bg-success text-white">
                    <div class="card-body">
                        <p class="mb-1 small">Active</p>
                        <h3 class="fw-bold" th:text="${activeAdmins}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center border-0 bg-secondary text-white">
                    <div class="card-body">
                        <p class="mb-1 small">Inactive</p>
                        <h3 class="fw-bold" th:text="${inactiveAdmins}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- By level -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-center border-danger">
                    <div class="card-body py-2">
                        <p class="text-muted mb-1 small">Super Admins</p>
                        <h4 class="text-danger fw-bold" th:text="${superCount}">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center border-primary">
                    <div class="card-body py-2">
                        <p class="text-muted mb-1 small">Managers</p>
                        <h4 class="text-primary fw-bold" th:text="${managerCount}">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center border-info">
                    <div class="card-body py-2">
                        <p class="text-muted mb-1 small">Staff</p>
                        <h4 class="text-info fw-bold" th:text="${staffCount}">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center border-warning">
                    <div class="card-body py-2">
                        <p class="text-muted mb-1 small">Never Logged In</p>
                        <h4 class="text-warning fw-bold" th:text="${neverLoggedIn}">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Activity log -->
        <div class="card mb-4">
            <div class="card-header">Recent Login Activity</div>
            <div class="card-body p-0">
                <table class="table table-sm table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Username</th>
                        <th>Level</th>
                        <th>Last Login</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${recentLogins}">
                        <td th:text="${a.username}"></td>
                        <td th:text="${a.adminLevel}"></td>
                        <td th:text="${a.lastLogin}" class="small"></td>
                        <td>
                            <span th:class="${a.active} ? 'badge bg-success' : 'badge bg-secondary'"
                                  th:text="${a.active} ? 'Active' : 'Inactive'"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recentLogins)}">
                        <td colspan="4" class="text-center text-muted small">No logins recorded yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Quick links -->
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/admin/list}" class="btn btn-outline-success btn-sm">Manage Admins</a>
            <a th:href="@{/admin/register}" th:if="${session.loggedInUser.adminLevel == 'SUPER'}"
               class="btn btn-outline-success btn-sm">Register New Admin</a>
            <a th:href="@{/admin/edit(id=${session.loggedInUser.id})}"
               class="btn btn-outline-secondary btn-sm">My Profile</a>
            <a th:href="@{/admin/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </div>
</main>
</html>
