<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Edit Admin</title>
<main>
    <div class="container mt-4" style="max-width: 520px;">
        <h2 class="mb-1">Edit Admin</h2>
        <p class="text-muted small mb-4">
            <span th:text="${admin.username}"></span> &middot;
            <span th:text="${admin.adminLevel}"></span> &middot; ID
            <span th:text="${admin.id}"></span>
        </p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/admin/edit}" method="post">
            <input type="hidden" name="id" th:value="${admin.id}">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:value="${admin.username}" disabled>
                <div class="form-text">Username cannot be changed.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" th:value="${admin.email}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" th:value="${admin.phone}"
                       pattern="[0-9]{10}" title="10 digit phone number">
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="2" th:text="${admin.address}"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="newPassword" class="form-control" minlength="6"
                       placeholder="Leave blank to keep current password">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Save Changes</button>
                <a th:href="@{/admin/list}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</html>
